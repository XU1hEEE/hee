[tool.poetry]
name = "hee"
version = "0.1.0"
description = "A local-first AI companion."
authors = ["Hee contributors"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "hee_bot" }]

[tool.poetry.dependencies]
python = "^3.9"
streamlit = "^1.33.0"
requests = "^2.31.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
